<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Noble Estates & Motors</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="js/config.js"></script><script src="js/pb.js"></script><script src="js/app.js"></script></head>
<body class="bg-bg text-ink font-sans antialiased transition-colors"><div id="nav"></div>
<main class="max-w-7xl mx-auto px-4 sm:px-6 pt-12">
 <section id="login" class="hidden max-w-md mx-auto rounded-2xl p-7 bg-surface border border-line">
  <h1 class="font-display text-3xl font-bold">Staff login</h1><p class="text-mute mt-2">Sign in with the admin account you created in PocketBase.</p>
  <form id="loginForm" class="mt-6 space-y-4">
   <div><label class="lbl" for="email">Email</label><input id="email" name="email" type="email" required autocomplete="username" class="inp"></div>
   <div><label class="lbl" for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password" class="inp"></div>
   <p id="loginErr" class="text-sm text-red-600" role="alert"></p>
   <button class="w-full rounded-xl py-3 font-semibold bg-home text-onacc hover:opacity-90 transition">Sign in</button></form>
 </section>
 <div id="app" class="hidden">
  <div class="flex flex-wrap items-center justify-between gap-4"><h1 class="font-display text-4xl font-bold">Admin</h1><button id="logout" class="text-sm font-semibold px-4 py-2 rounded-xl border border-line hover:bg-surface">Sign out</button></div>
  <div class="flex gap-1 mt-6 p-1 rounded-full bg-surface border border-line w-fit" role="tablist"><button data-tab="property" role="tab">Homes</button><button data-tab="car" role="tab">Cars</button><button data-tab="enq" role="tab">Enquiries</button></div>
  <div id="stats" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mt-6"></div>
  <div id="work"><form id="form" class="rounded-2xl p-6 bg-surface border border-line space-y-4"></form>
   <section><h2 id="listTitle" class="font-display text-2xl font-bold mb-4"></h2><div id="list" class="space-y-3"></div></section></div>
 </div>
</main><div id="footer"></div>
<script>
chrome('admin.html');
</script><script src="js/admin.js"></script></body></html>
